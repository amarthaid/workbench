version: "3.8"
services:
  a-workbench:
    build: .
    ports:
      - "3000:3000"
    # Pull every var from .env — SSO creds (GOOGLE_CLIENT_ID/_SECRET) AND all
    # per-plugin OAuth creds (GOOGLE_*_CLIENT_ID, ATLASSIAN_*). Without these,
    # /authorize and connect(<plugin>) 500 with "<X> not configured".
    env_file:
      - .env
    # Container-specific overrides — these win over env_file, so .env's dev
    # values (PORT=3001, NODE_ENV=development, relative DB path) don't leak in
    # and break the 3000:3000 mapping or the mounted data volume.
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=/data/tokens.db
      # Agent file workspace on the mounted volume. The default is relative to
      # the process cwd, which inside the image is the container filesystem —
      # every upload would vanish on the next `up --build`. Sharing ./data with
      # tokens.db is fine for a local bind mount; a real deployment gives the
      # workspace its own volume (see .env.example) so filling it cannot take
      # the database down.
      - WORKSPACE_DIR=/data/workspace
      - SERVER_PUBLIC_URL=${SERVER_PUBLIC_URL:-http://localhost:3000}
      - PORTAL_URL=${PORTAL_URL:-http://localhost:3000}
      # LOCAL ONLY (do not commit): load external plugins from the mounted dir.
      - PLUGINS_DIR=/app/custom-plugins
    volumes:
      - ./data:/data
      - ../custom-plugins:/app/custom-plugins:ro

  sample-oauth:
    build:
      context: .
      dockerfile: Dockerfile.sample-oauth
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development

# Fix: add SESSION_SECRET for production startup
