name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'packages/brand/**'
      - 'packages/plugins/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @a-workbench/shared -w @a-workbench/brand

      # The generated HTML is not committed. This job is its only author, so
      # what is published is always a build of the Markdown at this commit.
      - name: Build the docs site
        run: node docs/site/build.mjs

      # The landing site is the Pages root; the docs build above lands under
      # docs/ within it, so docsUrl and the OG image must resolve there.
      - name: Build the landing site
        run: npm run build -w @a-workbench/site
        env:
          SITE_DOCS_URL: docs/
          SITE_URL: https://barockok.github.io/workbench

      - name: Assemble the Pages output
        run: |
          mkdir -p _pages
          cp -R site/_site/. _pages/
          cp -R docs/site/_site/. _pages/docs/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
